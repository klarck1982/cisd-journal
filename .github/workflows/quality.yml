name: CISD Journal Quality Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  windows-build:
    needs: qa
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build:bridge:win
      - run: npm run validate:release:exe
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: CISD-Journal-Windows-Installer
          path: dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CISD-Journal-MT5-Bridge
          path: bridges/mt5_readonly_sync.exe
