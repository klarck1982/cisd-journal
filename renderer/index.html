<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; connect-src https:; object-src 'none'; base-uri 'none'; frame-ancestors 'none';">
  <title>CISD Journal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="titlebar">
      <div class="titlebar-left">
        <div class="app-badge">◈</div>
        <div>
          <strong id="appTitle">CISD Journal</strong>
          <small id="appSubtitle">Trading Discipline OS</small>
        </div>
      </div>
      <div class="titlebar-actions">
        <button id="minimizeBtn" class="ghost icon">—</button>
        <button id="maximizeBtn" class="ghost icon">□</button>
        <button id="closeBtn" class="ghost icon danger">×</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div class="sidebar-top">
          <div class="section-kicker" id="accountsKicker">Accounts</div>
          <button id="newAccountBtn" class="primary small">+ Challenge</button>
        </div>
        <div id="accountRail" class="account-rail"></div>

        <nav class="nav">
          <button class="nav-link active" data-page="overview" id="navOverview"></button>
          <button class="nav-link" data-page="signals" id="navSignals"></button>
          <button class="nav-link" data-page="journal" id="navJournal"></button>
          <button class="nav-link" data-page="backtest" id="navBacktest"></button>
          <button class="nav-link" data-page="playbooks" id="navPlaybooks"></button>
          <button class="nav-link" data-page="edge" id="navEdge"></button>
          <button class="nav-link" data-page="analytics" id="navAnalytics"></button>
          <button class="nav-link" data-page="data" id="navData"></button>
          <button class="nav-link" data-page="settings" id="navSettings"></button>
        </nav>

        <div class="sidebar-foot" id="sidebarFooter">LOCAL · PRIVATE · NO EA</div>
      </aside>

      <main class="content">
        <section class="status-dock panel slim">
          <div class="status-pill">
            <span class="status-label" id="statusAccountLabel"></span>
            <strong id="statusAccountValue"></strong>
          </div>
          <div class="status-pill">
            <span class="status-label" id="statusPageLabel"></span>
            <strong id="statusPageValue"></strong>
          </div>
          <div class="status-pill">
            <span class="status-label" id="statusLocaleLabel"></span>
            <strong id="statusLocaleValue"></strong>
          </div>
          <div class="status-pill wide">
            <span class="status-label" id="statusSyncLabel"></span>
            <strong id="statusSyncValue"></strong>
          </div>
        </section>

        <section class="page active" data-page="overview">
          <div class="page-head">
            <div>
              <div class="section-kicker" id="overviewKicker"></div>
              <h1 id="overviewTitle"></h1>
              <p id="overviewDescription"></p>
            </div>
            <div class="head-actions">
              <button id="overviewOpenTerminal" class="ghost"></button>
              <button id="overviewLoadNews" class="ghost"></button>
              <button id="overviewGoSignals" class="primary"></button>
            </div>
          </div>

          <section class="panel slim quick-start hidden" id="quickStartPanel">
            <div class="panel-head">
              <h3 id="quickStartTitle"></h3>
              <button id="quickStartDismiss" class="ghost small"></button>
            </div>
            <p class="muted" id="quickStartDescription"></p>
            <div id="quickStartSteps" class="quick-start-steps"></div>
          </section>

          <section class="panel spotlight overview-hero">
            <div class="hero-main">
              <div class="section-kicker" id="overviewHeroKicker"></div>
              <h2 id="overviewHeroTitle"></h2>
              <p id="overviewHeroText"></p>
              <div id="overviewHeroTags" class="tag-cloud"></div>
            </div>
            <div class="hero-side">
              <div class="hero-clock">
                <small id="overviewHeroTimeLabel"></small>
                <strong id="overviewHeroTimeValue"></strong>
                <span id="overviewHeroSessionValue"></span>
              </div>
              <div id="overviewHeroInsight" class="hero-insight"></div>
            </div>
          </section>

          <div class="grid three">
            <section class="panel span-two">
              <div class="panel-head">
                <h3 id="overviewHealthTitle"></h3>
                <span id="overviewAccountLabel" class="panel-hint"></span>
              </div>
              <div id="overviewHealthCards" class="metric-grid"></div>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h3 id="overviewRiskTitle"></h3>
                <span id="riskStateChip" class="chip"></span>
              </div>
              <div id="overviewRiskSummary" class="stack"></div>
              <div id="overviewWarnings" class="warning-stack"></div>
            </section>
          </div>

          <div class="grid three">
            <section class="panel">
              <div class="panel-head">
                <h3 id="overviewDisciplineTitle"></h3>
                <span id="disciplineScoreChip" class="chip"></span>
              </div>
              <div id="overviewDisciplineSummary" class="stack"></div>
              <div id="overviewReasons" class="tag-cloud"></div>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h3 id="overviewChallengeTitle"></h3>
                <span id="challengePercentChip" class="panel-hint"></span>
              </div>
              <div class="progress-track"><i id="challengeProgressBar"></i></div>
              <div id="overviewChallengeSummary" class="stack"></div>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h3 id="overviewNewsTitle"></h3>
                <span id="overviewNewsStatus" class="panel-hint"></span>
              </div>
              <div id="overviewNewsList" class="list"></div>
            </section>
          </div>

          <section class="panel">
            <div class="panel-head">
              <h3 id="overviewSignalsTitle"></h3>
              <span id="overviewSignalsHint" class="panel-hint"></span>
            </div>
            <div id="overviewSignalList" class="list"></div>
          </section>
        </section>

        <section class="page" data-page="signals">
          <div class="page-head">
            <div>
              <div class="section-kicker" id="signalsKicker"></div>
              <h1 id="signalsTitle"></h1>
              <p id="signalsDescription"></p>
            </div>
            <div class="head-actions">
              <button id="chooseCsvBtn" class="ghost"></button>
              <button id="refreshSnapshotsBtn" class="ghost"></button>
            </div>
          </div>

          <div class="panel slim">
            <div class="panel-head">
              <h3 id="signalsSourceTitle"></h3>
              <span id="signalsCsvPath" class="panel-hint"></span>
            </div>
          </div>

          <div class="grid three">
            <section class="panel">
              <div class="panel-head">
                <h3 id="signalsSummaryTitle"></h3>
                <span class="panel-hint" id="signalsSummaryHint"></span>
              </div>
              <div id="signalsSummaryCards" class="metric-grid compact"></div>
            </section>

            <section class="panel span-two">
              <div class="panel-head">
                <h3 id="signalsLiveTitle"></h3>
                <span class="panel-hint" id="signalsLiveHint"></span>
              </div>
              <div class="toolbar-inline">
                <input id="signalsSearch" class="search-input" type="search" placeholder="Search signals">
              </div>
              <div id="signalList" class="signal-list"></div>
            </section>
          </div>
        </section>

        <section class="page" data-page="journal">
          <div class="page-head">
            <div>
              <div class="section-kicker" id="journalKicker"></div>
              <h1 id="journalTitle"></h1>
              <p id="journalDescription"></p>
            </div>
          </div>

          <section id="journalGuidancePanel" class="panel slim journal-guidance hidden">
            <div class="panel-head">
              <h3 id="journalGuidanceTitle"></h3>
              <div class="button-row">
                <button id="journalGuidanceBackBtn" class="ghost small"></button>
                <button id="journalGuidanceClearBtn" class="ghost small"></button>
              </div>
            </div>
            <p id="journalGuidanceText" class="muted"></p>
            <div id="journalGuidanceTags" class="tag-cloud"></div>
          </section>

          <div class="grid two">
            <section class="panel">
              <div class="panel-head">
                <h3 id="tradeFormTitle"></h3>
                <span id="tradeFormHint" class="panel-hint"></span>
              </div>
              <form id="tradeForm" class="form-grid">
                <label>
                  <span id="tradeSignalLabel"></span>
                  <select id="tradeSignal"></select>
                </label>
                <label>
                  <span id="tradeSourceLabel"></span>
                  <select id="tradeSource">
                    <option value="Manual">Manual</option>
                    <option value="CISD">CISD</option>
                  </select>
                </label>
                <label class="full">
                  <span id="tradePlaybookLabel"></span>
                  <select id="tradePlaybook"></select>
                </label>
                <div class="full hidden" id="tradeRulesWrap">
                  <span class="chart-attach-title" id="tradeRulesLabel"></span>
                  <div id="tradeRulesChecklist" class="rules-checklist"></div>
                </div>
                <label>
                  <span id="tradeSymbolLabel"></span>
                  <input id="tradeSymbol" placeholder="XAUUSD">
                </label>
                <label>
                  <span id="tradeSideLabel"></span>
                  <select id="tradeSide">
                    <option value="Buy">Buy</option>
                    <option value="Sell">Sell</option>
                  </select>
                </label>
                <label>
                  <span id="tradeDateLabel"></span>
                  <input id="tradeDate" type="date">
                </label>
                <label>
                  <span id="tradeResultLabel"></span>
                  <input id="tradeResult" type="number" step="0.01" placeholder="1.5">
                </label>
                <label class="full">
                  <span id="tradeTagsLabel"></span>
                  <input id="tradeTags" placeholder="CISD, London, Followed Plan">
                </label>
                <label class="full">
                  <span id="tradeNoteLabel"></span>
                  <textarea id="tradeNote" rows="4" placeholder="Why did you execute or hesitate?"></textarea>
                </label>
                <div class="full chart-attach">
                  <span class="chart-attach-title" id="tradeChartsTitle"></span>
                  <div class="chart-attach-grid">
                    <div class="chart-slot" data-slot="before">
                      <small id="tradeChartBeforeLabel"></small>
                      <div class="chart-slot-preview" id="tradeChartBeforePreview"></div>
                      <div class="chart-slot-actions">
                        <button type="button" class="ghost small" id="tradeChartBeforeBtn"></button>
                        <button type="button" class="ghost small danger hidden" id="tradeChartBeforeClear"></button>
                      </div>
                    </div>
                    <div class="chart-slot" data-slot="after">
                      <small id="tradeChartAfterLabel"></small>
                      <div class="chart-slot-preview" id="tradeChartAfterPreview"></div>
                      <div class="chart-slot-actions">
                        <button type="button" class="ghost small" id="tradeChartAfterBtn"></button>
                        <button type="button" class="ghost small danger hidden" id="tradeChartAfterClear"></button>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="form-actions full">
                  <button type="submit" class="primary" id="saveTradeBtn"></button>
                </div>
              </form>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h3 id="recentTradesTitle"></h3>
                <button id="exportTradesBtn" class="ghost small"></button>
              </div>
              <div class="toolbar-inline">
                <input id="journalSearch" class="search-input" type="search" placeholder="Search trades">
              </div>
              <div id="recentTradesList" class="list"></div>
            </section>
          </div>
        </section>

        <section class="page" data-page="backtest">
          <div class="page-head">
            <div>
              <div class="section-kicker" id="backtestKicker"></div>
              <h1 id="backtestTitle"></h1>
              <p id="backtestDescription"></p>
            </div>
          </div>

          <div class="grid two">
            <section class="panel">
              <div class="panel-head">
                <h3 id="backtestCreateTitle"></h3>
                <span id="backtestCreateHint" class="panel-hint"></span>
              </div>
              <form id="backtestForm" class="form-grid">
                <label>
                  <span id="backtestNameLabel"></span>
                  <input id="backtestName" placeholder="London Gold Drill">
                </label>
                <label>
                  <span id="backtestSessionLabel"></span>
                  <select id="backtestSession">
                    <option value="">All</option>
                    <option value="London">London</option>
                    <option value="New York">New York</option>
                    <option value="After">After</option>
                  </select>
                </label>
                <label>
                  <span id="backtestStartLabel"></span>
                  <input id="backtestStart" type="date">
                </label>
                <label>
                  <span id="backtestEndLabel"></span>
                  <input id="backtestEnd" type="date">
                </label>
                <label>
                  <span id="backtestSymbolLabel"></span>
                  <input id="backtestSymbol" placeholder="XAUUSD">
                </label>
                <label>
                  <span id="backtestTfLabel"></span>
                  <input id="backtestTf" placeholder="15m">
                </label>
                <div class="form-actions full">
                  <button type="submit" class="primary" id="backtestStartBtn"></button>
                </div>
              </form>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h3 id="backtestLibraryTitle"></h3>
                <span id="backtestLibraryHint" class="panel-hint"></span>
              </div>
              <div id="backtestLibrary" class="list"></div>
            </section>
          </div>

          <section class="panel slim backtest-spotlight">
            <div class="panel-head">
              <h3 id="backtestSpotlightTitle"></h3>
              <span id="backtestSpotlightHint" class="panel-hint"></span>
            </div>
            <div id="backtestSpotlightCards" class="metric-grid compact"></div>
            <div id="backtestSpotlightTags" class="tag-cloud"></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h3 id="backtestReviewTitle"></h3>
              <span id="backtestReviewHint" class="panel-hint"></span>
            </div>
            <div class="toolbar-inline">
              <input id="backtestSearch" class="search-input" type="search" placeholder="Search backtest signals">
            </div>
            <div id="backtestReviewList" class="list"></div>
          </section>
        </section>

        <section class="page" data-page="playbooks">
          <div class="page-head">
            <div>
              <div class="section-kicker" id="playbooksKicker"></div>
              <h1 id="playbooksTitle"></h1>
              <p id="playbooksDescription"></p>
            </div>
            <div class="head-actions">
              <button id="newPlaybookBtn" class="primary"></button>
            </div>
          </div>

          <div id="playbooksSummary" class="metric-grid"></div>
          <div id="playbooksList" class="list playbook-list"></div>
        </section>

        <section class="page" data-page="edge">
          <div class="page-head">
            <div>
              <div class="section-kicker" id="edgeKicker"></div>
              <h1 id="edgeTitle"></h1>
              <p id="edgeDescription"></p>
            </div>
            <div class="head-actions">
              <div class="edge-score-badge">
                <small id="edgeScoreLabel"></small>
                <strong id="edgeScoreValue">—</strong>
                <span id="edgeScoreGrade" class="chip"></span>
              </div>
            </div>
          </div>

          <section class="panel spotlight hesitation-hero">
            <div class="hesitation-main">
              <div class="section-kicker" id="edgeHesitationKicker"></div>
              <div id="edgeHesitationHeadline" class="hesitation-headline"></div>
              <div id="edgeHesitationNote" class="hesitation-note"></div>
            </div>
            <div id="edgeHesitationCards" class="metric-grid compact"></div>
          </section>

          <div class="grid two">
            <section class="panel">
              <div class="panel-head">
                <h3 id="edgeReasonsTitle"></h3>
                <span class="panel-hint" id="edgeReasonsHint"></span>
              </div>
              <div id="edgeReasonsList" class="list"></div>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h3 id="edgePotentialTitle"></h3>
                <span class="panel-hint" id="edgePotentialHint"></span>
              </div>
              <div id="edgePotentialBars" class="potential-bars"></div>
              <div id="edgeUplift" class="inline-note"></div>
            </section>
          </div>

          <section class="panel">
            <div class="panel-head"><h3 id="edgeStatsTitle"></h3></div>
            <div id="edgeStatsCards" class="metric-grid large"></div>
          </section>

          <div class="grid two">
            <section class="panel">
              <div class="panel-head">
                <h3 id="edgeDistributionTitle"></h3>
                <span class="panel-hint" id="edgeDistributionHint"></span>
              </div>
              <div id="edgeDistribution" class="r-distribution"></div>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h3 id="edgeScoreTitle"></h3>
                <span class="panel-hint" id="edgeScoreHint"></span>
              </div>
              <div id="edgeScoreComponents" class="score-components"></div>
            </section>
          </div>

          <section class="panel">
            <div class="panel-head"><h3 id="edgeInsightsTitle"></h3></div>
            <div id="edgeInsightsList" class="list"></div>
          </section>
        </section>

        <section class="page" data-page="analytics">
          <div class="page-head">
            <div>
              <div class="section-kicker" id="analyticsKicker"></div>
              <h1 id="analyticsTitle"></h1>
              <p id="analyticsDescription"></p>
            </div>
            <div class="filters">
              <select id="filterPeriod"></select>
              <select id="filterSource"></select>
              <select id="filterInstrument"></select>
              <select id="filterSide"></select>
              <select id="filterSession"></select>
            </div>
          </div>

          <section class="panel slim analytics-filter-panel">
            <div class="panel-head">
              <h3 id="analyticsFilterTitle"></h3>
              <span class="panel-hint" id="analyticsFilterHint"></span>
            </div>
            <div id="analyticsFilterChips" class="tag-cloud"></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h3 id="analyticsSummaryTitle"></h3>
              <span id="analyticsSummaryHint" class="panel-hint"></span>
            </div>
            <div id="analyticsSummaryCards" class="metric-grid large"></div>
          </section>

          <div class="grid three">
            <section class="panel span-two">
              <div class="panel-head">
                <h3 id="analyticsCurveTitle"></h3>
                <span class="panel-hint" id="analyticsCurveHint"></span>
              </div>
              <div id="analyticsCurve" class="chart-box"></div>
              <div id="analyticsCurveMeta" class="micro-stats"></div>
            </section>
            <section class="panel">
              <div class="panel-head">
                <h3 id="analyticsBacktestTitle"></h3>
                <span class="panel-hint" id="analyticsBacktestHint"></span>
              </div>
              <div id="analyticsBacktestComparison" class="list"></div>
            </section>
          </div>

          <div class="grid three">
            <section class="panel">
              <div class="panel-head"><h3 id="analyticsSourceTitle"></h3></div>
              <div id="analyticsBySource" class="list"></div>
            </section>
            <section class="panel">
              <div class="panel-head"><h3 id="analyticsSessionTitle"></h3></div>
              <div id="analyticsBySession" class="list"></div>
            </section>
            <section class="panel">
              <div class="panel-head"><h3 id="analyticsSideTitle"></h3></div>
              <div id="analyticsBySide" class="list"></div>
            </section>
          </div>

          <div class="grid three">
            <section class="panel">
              <div class="panel-head"><h3 id="analyticsInstrumentTitle"></h3></div>
              <div id="analyticsByInstrument" class="list"></div>
            </section>
            <section class="panel">
              <div class="panel-head"><h3 id="analyticsTagTitle"></h3></div>
              <div id="analyticsByTag" class="list"></div>
            </section>
            <section class="panel">
              <div class="panel-head"><h3 id="analyticsMonthTitle"></h3></div>
              <div id="analyticsByMonth" class="list"></div>
            </section>
          </div>

          <section class="panel">
            <div class="panel-head">
              <h3 id="analyticsHeatmapTitle"></h3>
              <span class="panel-hint" id="analyticsHeatmapHint"></span>
            </div>
            <div id="analyticsHeatmap" class="heatmap"></div>
          </section>
        </section>

        <section class="page" data-page="data">
          <div class="page-head">
            <div>
              <div class="section-kicker" id="dataKicker"></div>
              <h1 id="dataTitle"></h1>
              <p id="dataDescription"></p>
            </div>
            <div class="head-actions">
              <button id="importMt5Btn" class="ghost"></button>
              <button id="importFundedNextBtn" class="ghost"></button>
              <button id="watchFundedNextBtn" class="ghost"></button>
            </div>
          </div>

          <div class="grid three">
            <section class="panel">
              <div class="panel-head"><h3 id="dataSourcesTitle"></h3></div>
              <div id="dataSourcesList" class="list"></div>
            </section>
            <section class="panel span-two">
              <div class="panel-head">
                <h3 id="dataImportsTitle"></h3>
                <span class="panel-hint" id="dataImportsHint"></span>
              </div>
              <div id="dataImportHistory" class="list"></div>
            </section>
          </div>
        </section>

        <section class="page" data-page="settings">
          <div class="page-head">
            <div>
              <div class="section-kicker" id="settingsKicker"></div>
              <h1 id="settingsTitle"></h1>
              <p id="settingsDescription"></p>
            </div>
          </div>

          <div class="grid two">
            <section class="panel">
              <div class="panel-head"><h3 id="accountSettingsTitle"></h3></div>
              <form id="accountSettingsForm" class="form-grid compact-form">
                <label>
                  <span id="accountFirmLabel"></span>
                  <input id="accountFirmInput">
                </label>
                <label>
                  <span id="accountNameLabel"></span>
                  <input id="accountNameInput">
                </label>
                <label>
                  <span id="accountCapitalLabel"></span>
                  <input id="accountCapitalInput" type="number" min="0" step="any">
                </label>
                <label>
                  <span id="accountBalanceLabel"></span>
                  <input id="accountBalanceInput" type="number" min="0" step="any">
                </label>
                <label>
                  <span id="accountCurrencyLabel"></span>
                  <select id="accountCurrencyInput">
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                  </select>
                </label>
                <label>
                  <span id="accountPhaseLabel"></span>
                  <select id="accountPhaseInput">
                    <option value="Challenge">Challenge</option>
                    <option value="Phase 1">Phase 1</option>
                    <option value="Phase 2">Phase 2</option>
                    <option value="Funded">Funded</option>
                    <option value="Practice">Practice</option>
                  </select>
                </label>
                <label>
                  <span id="accountTargetLabel"></span>
                  <input id="accountTargetInput" type="number" min="0" step="0.1">
                </label>
                <label>
                  <span id="accountDailyLossLabel"></span>
                  <input id="accountDailyLossInput" type="number" min="0" step="0.1">
                </label>
                <label>
                  <span id="accountMaxDrawdownLabel"></span>
                  <input id="accountMaxDrawdownInput" type="number" min="0" step="0.1">
                </label>
                <div class="form-actions full">
                  <button id="saveAccountSettingsBtn" type="submit" class="primary"></button>
                </div>
              </form>
            </section>

            <section class="panel">
              <div class="panel-head"><h3 id="fundingAccessTitle"></h3></div>
              <p class="muted" id="fundingAccessDescription"></p>
              <div class="form-grid compact-form">
                <label>
                  <span id="fundingAccessModeLabel"></span>
                  <select id="fundingAccessModeInput">
                    <option value="none">Manual only</option>
                    <option value="investor_pass">Investor Pass</option>
                    <option value="shared_url">Share Dashboard URL</option>
                  </select>
                </label>
                <label>
                  <span id="fundingSyncScopeLabel"></span>
                  <select id="fundingSyncScopeInput">
                    <option value="account_health_only">Account health only</option>
                    <option value="account_and_open_positions">Account + open positions</option>
                    <option value="full_readonly">Full read-only</option>
                  </select>
                </label>
                <label class="full investor-field">
                  <span id="investorLoginLabel"></span>
                  <input id="investorLoginInput" placeholder="12345678">
                </label>
                <label class="full investor-field">
                  <span id="investorServerLabel"></span>
                  <input id="investorServerInput" placeholder="Broker-Server">
                </label>
                <label class="full investor-field">
                  <span id="investorPasswordLabel"></span>
                  <input id="investorPasswordInput" type="password" placeholder="Investor Password">
                </label>
                <label class="full shared-url-field">
                  <span id="sharedUrlLabel"></span>
                  <input id="sharedUrlInput" type="url" placeholder="https://...">
                </label>
                <div class="form-actions full">
                  <button id="saveFundingAccessBtn" type="button" class="ghost"></button>
                  <button id="syncFundingAccessBtn" type="button" class="primary"></button>
                  <button id="openFundingAccessBtn" type="button" class="ghost"></button>
                </div>
                <div id="fundingAccessStatus" class="inline-note"></div>
              </div>
            </section>
          </div>

          <div class="grid two">
            <section class="panel">
              <div class="panel-head"><h3 id="preferencesTitle"></h3></div>
              <div class="form-grid compact-form">
                <label>
                  <span id="settingsLanguageLabel"></span>
                  <select id="settingsLanguage">
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                  </select>
                </label>
                <label>
                  <span id="settingsTimezoneLabel"></span>
                  <select id="settingsTimezone">
                    <option value="America/New_York">New York</option>
                    <option value="Asia/Damascus">Damascus</option>
                    <option value="GMT">GMT</option>
                  </select>
                </label>
                <label class="toggle full">
                  <input id="settingsNotifications" type="checkbox">
                  <span id="settingsNotificationsLabel"></span>
                </label>
                <div class="form-actions full">
                  <button id="savePreferencesBtn" class="primary"></button>
                </div>
              </div>
            </section>

            <section class="panel">
              <div class="panel-head"><h3 id="terminalTitle"></h3></div>
              <p class="muted" id="terminalDescription"></p>
              <div class="button-row">
                <button id="chooseTerminalBtn" class="ghost"></button>
                <button id="openTerminalBtn" class="ghost"></button>
              </div>
              <div id="terminalPathLabel" class="inline-note"></div>
            </section>
          </div>

          <div class="grid two">
            <section class="panel">
              <div class="panel-head"><h3 id="newsSettingsTitle"></h3></div>
              <div class="form-grid compact-form">
                <label>
                  <span id="newsProviderLabel"></span>
                  <select id="newsProvider">
                    <option value="FMP">FMP Free</option>
                    <option value="TE">Trading Economics</option>
                  </select>
                </label>
                <label class="full">
                  <span id="newsKeyLabel"></span>
                  <input id="newsKey" type="password" placeholder="API Key">
                </label>
                <div class="form-actions full">
                  <button id="saveNewsSettingsBtn" class="ghost"></button>
                  <button id="testNewsBtn" class="ghost"></button>
                </div>
                <div id="newsConnectionStatus" class="inline-note"></div>
              </div>
            </section>

            <section class="panel">
              <div class="panel-head"><h3 id="maintenanceTitle"></h3></div>
              <div class="button-column">
                <button id="backupBtn" class="ghost"></button>
                <button id="restoreBtn" class="ghost"></button>
                <button id="openGuideBtn" class="ghost"></button>
                <button id="restartOnboardingBtn" class="ghost"></button>
              </div>
            </section>
          </div>

          <section class="panel danger-zone">
            <div class="panel-head"><h3 id="dangerZoneTitle"></h3></div>
            <p class="muted" id="dangerZoneDescription"></p>
            <div class="button-row">
              <button id="resetAccountBtn" class="ghost danger"></button>
            </div>
          </section>
        </section>
      </main>
    </div>
  </div>

  <div id="accountModal" class="modal hidden">
    <div class="modal-card">
      <div class="panel-head">
        <h3 id="accountModalTitle"></h3>
        <button id="closeAccountModal" class="ghost icon">×</button>
      </div>
      <p id="accountModalDescription" class="muted"></p>
      <form id="accountModalForm" class="form-grid compact-form">
        <label>
          <span id="accountModalFirmLabel"></span>
          <input id="accountModalFirm" autocomplete="off">
        </label>
        <label>
          <span id="accountModalNameLabel"></span>
          <input id="accountModalName" autocomplete="off">
        </label>
        <label>
          <span id="accountModalCapitalLabel"></span>
          <input id="accountModalCapital" type="number" min="0" step="100">
        </label>
        <label>
          <span id="accountModalCurrencyLabel"></span>
          <select id="accountModalCurrency">
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
          </select>
        </label>
        <label>
          <span id="accountModalPhaseLabel"></span>
          <select id="accountModalPhase">
            <option value="Challenge">Challenge</option>
            <option value="Phase 1">Phase 1</option>
            <option value="Phase 2">Phase 2</option>
            <option value="Funded">Funded</option>
            <option value="Practice">Practice</option>
          </select>
        </label>
        <label>
          <span id="accountModalTargetLabel"></span>
          <input id="accountModalTarget" type="number" min="0" step="0.1">
        </label>
        <label>
          <span id="accountModalDailyLossLabel"></span>
          <input id="accountModalDailyLoss" type="number" min="0" step="0.1">
        </label>
        <label>
          <span id="accountModalDrawdownLabel"></span>
          <input id="accountModalDrawdown" type="number" min="0" step="0.1">
        </label>
        <div class="form-actions full">
          <button type="button" class="ghost" id="cancelAccountModal"></button>
          <button type="submit" class="primary" id="submitAccountModal"></button>
        </div>
      </form>
    </div>
  </div>

  <div id="playbookModal" class="modal hidden">
    <div class="modal-card">
      <div class="panel-head">
        <h3 id="playbookModalTitle"></h3>
        <button id="closePlaybookModal" class="ghost icon">×</button>
      </div>
      <form id="playbookForm" class="form-grid compact-form">
        <label class="full">
          <span id="playbookNameLabel"></span>
          <input id="playbookName" autocomplete="off">
        </label>
        <label class="full">
          <span id="playbookDescriptionLabel"></span>
          <input id="playbookDescription" autocomplete="off">
        </label>
        <label class="full">
          <span id="playbookRulesLabel"></span>
          <textarea id="playbookRules" rows="5"></textarea>
        </label>
        <label>
          <span id="playbookMaxRiskLabel"></span>
          <input id="playbookMaxRisk" type="number" min="0" step="0.1">
        </label>
        <label>
          <span id="playbookMaxTradesLabel"></span>
          <input id="playbookMaxTrades" type="number" min="0" step="1">
        </label>
        <div class="full">
          <span class="chart-attach-title" id="playbookMatchTitle"></span>
          <p class="muted playbook-match-hint" id="playbookMatchHint"></p>
        </div>
        <label>
          <span id="playbookSymbolLabel"></span>
          <input id="playbookSymbol" autocomplete="off" placeholder="XAUUSD">
        </label>
        <label>
          <span id="playbookSessionLabel"></span>
          <input id="playbookSession" autocomplete="off" placeholder="London">
        </label>
        <label>
          <span id="playbookTimeframeLabel"></span>
          <input id="playbookTimeframe" autocomplete="off" placeholder="15m">
        </label>
        <div class="form-actions full">
          <button type="button" class="ghost" id="cancelPlaybookModal"></button>
          <button type="submit" class="primary" id="submitPlaybookModal"></button>
        </div>
      </form>
    </div>
  </div>

  <div id="confirmModal" class="modal hidden">
    <div class="modal-card confirm-modal-card">
      <div class="panel-head">
        <h3 id="confirmModalTitle"></h3>
        <button id="closeConfirmModal" class="ghost icon">×</button>
      </div>
      <p id="confirmModalText" class="muted"></p>
      <label class="full hidden" id="confirmModalTypeWrap">
        <span id="confirmModalTypeLabel"></span>
        <input id="confirmModalTypeInput" autocomplete="off">
      </label>
      <div class="form-actions">
        <button type="button" class="ghost" id="cancelConfirmModal"></button>
        <button type="button" class="primary danger-solid" id="acceptConfirmModal"></button>
      </div>
    </div>
  </div>

  <div id="reasonModal" class="modal hidden">
    <div class="modal-card">
      <div class="panel-head">
        <h3 id="reasonModalTitle"></h3>
        <button id="closeReasonModal" class="ghost icon">×</button>
      </div>
      <p id="reasonModalDescription" class="muted"></p>
      <div id="reasonPresets" class="preset-grid"></div>
      <label class="full">
        <span id="reasonNoteLabel"></span>
        <textarea id="reasonNote" rows="4"></textarea>
      </label>
      <div class="form-actions">
        <button id="saveReasonBtn" class="primary"></button>
      </div>
    </div>
  </div>

  <div id="backtestReviewModal" class="modal hidden">
    <div class="modal-card review-modal-card">
      <div class="panel-head">
        <h3 id="backtestReviewModalTitle"></h3>
        <button id="closeBacktestReviewModal" class="ghost icon">×</button>
      </div>
      <p id="backtestReviewModalDescription" class="muted"></p>
      <div id="backtestReviewSignalSummary" class="review-signal-summary"></div>
      <label class="full">
        <span id="backtestReviewStatusLabel"></span>
        <div id="backtestReviewStatusButtons" class="preset-grid review-status-grid"></div>
      </label>
      <label class="full">
        <span id="backtestReviewResultLabel"></span>
        <input id="backtestReviewResultInput" type="number" step="0.01" placeholder="1.0">
      </label>
      <label class="full">
        <span id="backtestReviewNoteLabel"></span>
        <textarea id="backtestReviewNoteInput" rows="4"></textarea>
      </label>
      <div class="form-actions">
        <button id="saveBacktestReviewBtn" class="primary"></button>
      </div>
    </div>
  </div>

  <div id="appLoading" class="loading-overlay hidden" aria-live="polite">
    <div class="loading-card">
      <div class="spinner"></div>
      <div id="loadingText">Loading…</div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
